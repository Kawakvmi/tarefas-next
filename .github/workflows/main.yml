name: CI - Lint, Test & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Create .env for CI (safe defaults)
        run: |
          echo "NEXT_TELEMETRY_DISABLED=1" >> .env
          echo "NEXT_PUBLIC_API_URL=http://localhost:3001" >> .env

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          CI: "true"
        run: npm run test

      - name: Build
        run: npm run build
